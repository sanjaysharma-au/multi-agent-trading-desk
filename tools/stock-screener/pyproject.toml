[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonshot"
version = "0.1.0"
description = "Find US stocks that were multibaggers (rose Nx within a window)"
requires-python = ">=3.11"
dependencies = ["yfinance>=0.2.40", "pandas>=2.0", "pyarrow>=14", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moonshot = "moonshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
moonshot = ["*.html"]
